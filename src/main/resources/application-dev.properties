# -----------------------------------------------
# "dev" PROFILE (Your Local Machine)
# This file is ONLY active when 'spring.profiles.active=dev'
# -----------------------------------------------
# 1. Import Secrets
# This tells Spring to load the .env file from the project root.
spring.config.import=optional:dotenv:.env
# 2. Database (DataSource) Configuration
# Connects to your main development database
spring.datasource.url=jdbc:postgresql://localhost:5432/kinesis_dev_db
spring.datasource.username=postgres
spring.datasource.password=Ramayan786@
# 3. JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 4. JWT (JSON WEB TOKEN) SECURITY
app.jwt.secret=ghgdgdgfshdgfftrgfxfc21324t56rry(*&^%jhfhgf
# 24 hours
app.jwt.expiration-ms=86400000
# 5. Security Hardening
security.bcrypt.strength=11
# 6. Logging Configuration
logging.level.com.myapp.kinesis=DEBUG
logging.level.org.springframework.security=TRACE
# 7. Enable Swagger/OpenAPI for 'dev'
springdoc.swagger-ui.path=/swagger-ui.html